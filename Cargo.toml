[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
mett-core = { path = "crates/mett-core" }
mett-ews = { path = "crates/mett-ews" }
mett-msgraph = { path = "crates/mett-msgraph" }

base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8.35"
getrandom = "0.4.3"
keyring = "4.2.0"
open = "5.4.4"
ratatui = "0.30.2"
regex = "1.13.1"
roxmltree = "0.21.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = "1.53.3"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
