[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/igelado/mett"

[workspace.dependencies]
mett-core = { path = "crates/mett-core" }
mett-ews = { path = "crates/mett-ews" }
mett-msgraph = { path = "crates/mett-msgraph" }
mett-sqlite = { path = "crates/mett-sqlite" }

base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The built-in editor. Its own clipboard (arboard, the system one, is
# left out): a terminal pastes on its own.
edtui = { version = "0.11.7", default-features = false }
encoding_rs = "0.8.35"
getrandom = "0.4.3"
keyring = "4.2.0"
open = "5.4.4"
ratatui = "0.30.2"
regex = "1.13.1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = "1.53.3"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
