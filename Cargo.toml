[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
mett-core = { path = "crates/mett-core" }

chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2.0.21"
tokio = "1.53.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
