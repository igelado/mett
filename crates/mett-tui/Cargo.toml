[package]
name = "mett-tui"
description = "mett: a mutt-like terminal mail client for Office365"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mett"
path = "src/main.rs"

# mett in a window of its own; `--no-default-features` leaves it out.
[[bin]]
name = "mett-gui"
path = "src/bin/mett-gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = [
    "dep:arboard",
    "dep:fontdb",
    "dep:png",
    "dep:pollster",
    "dep:ratatui-wgpu",
    "dep:ttf-parser",
    "dep:winit",
]

[dependencies]
# The `mock` store backs `mett --demo`.
mett-core = { workspace = true, features = ["mock"] }
mett-ews.workspace = true
mett-imap.workspace = true
mett-msgraph.workspace = true
mett-smtp.workspace = true
mett-sqlite.workspace = true

base64.workspace = true
chrono.workspace = true
edtui.workspace = true
encoding_rs.workspace = true
open.workspace = true
ratatui.workspace = true
regex.workspace = true
reqwest.workspace = true
spellbook.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true

arboard = { workspace = true, optional = true }
fontdb = { workspace = true, optional = true }
png = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
ratatui-wgpu = { workspace = true, optional = true }
ttf-parser = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
# Paused time, for retries after a wait.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

[lints]
workspace = true
