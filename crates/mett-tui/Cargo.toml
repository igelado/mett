[package]
name = "mett-tui"
description = "mett: a mutt-like terminal mail client for Office365"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mett"
path = "src/main.rs"

[dependencies]
# The `mock` store backs `mett --demo`.
mett-core = { workspace = true, features = ["mock"] }
mett-ews.workspace = true
mett-msgraph.workspace = true
mett-sqlite.workspace = true

base64.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
open.workspace = true
ratatui.workspace = true
regex.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Paused time, for retries after a wait.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

[lints]
workspace = true
