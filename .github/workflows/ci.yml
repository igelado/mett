# CI, run by GitHub Actions on every pull request (and again on each push
# to it), and on main once merged. PRs can only be merged into main when
# every one of these jobs succeeds (see AGENTS.md).

name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fails if a Markdown file links to a relative path that does not exist.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          status=0
          for f in $(find . -name '*.md' -not -path './.git/*' -not -path './target/*'); do
            for link in $(grep -oE '\]\([^)#:[:space:]]+(#[^)]*)?\)' "$f" | sed -E 's/^\]\(//; s/\)$//; s/#.*//'); do
              [ -e "$(dirname "$f")/$link" ] || { echo "$f: broken link: $link"; status=1; }
            done
          done
          exit $status

  rust:
    runs-on: ubuntu-latest
    container:
      image: rust:1.95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # The same, on the other systems mett is released for (no container
  # there: Rust 1.95 is installed with the runner's rustup).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-
      - run: rustup toolchain install 1.95 --profile minimal -c clippy && rustup default 1.95
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - run: rustup toolchain install 1.95 --profile minimal -c clippy && rustup default 1.95
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
