# CI, run by GitHub Actions on every push. PRs can only be merged into main
# when these jobs succeed (see AGENTS.md).

name: ci
on: push

permissions:
  contents: read

jobs:
  # Fails if a Markdown file links to a relative path that does not exist.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          status=0
          for f in $(find . -name '*.md' -not -path './.git/*' -not -path './target/*'); do
            for link in $(grep -oE '\]\([^)#:[:space:]]+(#[^)]*)?\)' "$f" | sed -E 's/^\]\(//; s/\)$//; s/#.*//'); do
              [ -e "$(dirname "$f")/$link" ] || { echo "$f: broken link: $link"; status=1; }
            done
          done
          exit $status

  rust:
    runs-on: ubuntu-latest
    container:
      image: rust:1.95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
