# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings. Project conventions live in AGENTS.md.

language: en-US

reviews:
  profile: chill
  # Don't post a commit status: merges are gated by the CI pipeline and by
  # resolved review threads (see AGENTS.md).
  commit_status: false
  auto_review:
    enabled: true
    drafts: false
