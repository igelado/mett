# The same checks as .gitlab-ci.yml, run by Forgejo Actions on the copy at
# git.gelado.org. Keep the two in step.

on: push

jobs:
  # Fails if a Markdown file links to a relative path that does not exist.
  docs:
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      # Actions are JavaScript, so the container needs Node.
      - run: apk add --no-cache nodejs git
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: |
          status=0
          for f in $(find . -name '*.md' -not -path './.git/*' -not -path './target/*'); do
            for link in $(grep -oE '\]\([^)#:[:space:]]+(#[^)]*)?\)' "$f" | sed -E 's/^\]\(//; s/\)$//; s/#.*//'); do
              [ -e "$(dirname "$f")/$link" ] || { echo "$f: broken link: $link"; status=1; }
            done
          done
          exit $status

  rust:
    runs-on: docker
    container:
      image: rust:1.95
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
